<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="4" />

  <!-- Shield Shape in Center -->
  <path d="M 256 80 L 390 135 C 390 270 330 370 256 425 C 182 370 122 270 122 135 Z" 
        fill="#1e293b" fill-opacity="0.7" stroke="url(#accentGrad)" stroke-width="8" filter="url(#glow)"/>

  <!-- Graduation Cap -->
  <path d="M 256 160 L 350 205 L 256 250 L 162 205 Z" fill="url(#accentGrad)" />
  <path d="M 200 230 L 200 275 C 200 295 312 295 312 275 L 312 230" fill="none" stroke="#60a5fa" stroke-width="7" stroke-linecap="round" />
  <path d="M 335 220 L 335 280 L 325 290" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />

  <!-- QR Scan Marks within Shield -->
  <g fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round">
    <!-- QR Corner Top Left -->
    <path d="M 210 320 L 210 340 L 230 340" />
    <!-- QR Corner Top Right -->
    <path d="M 302 320 L 302 340 L 282 340" />
    <!-- QR Corner Bottom Left -->
    <path d="M 210 375 L 210 355 L 230 355" />
    <!-- QR Corner Bottom Right -->
    <path d="M 302 375 L 302 355 L 282 355" />
  </g>

  <!-- Center Verification Checkmark -->
  <circle cx="256" cy="350" r="14" fill="#10b981" />
  <path d="M 250 350 L 254 354 L 263 344" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Offline Jammer Resilience Indicator Wave -->
  <path d="M 170 450 C 210 440 230 460 256 450 C 282 440 302 460 342 450" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10" />
</svg>
